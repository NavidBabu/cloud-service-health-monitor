apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-service-health-monitor
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloud-service-health-monitor}
  template:
    metadata:
      labels: {app: cloud-service-health-monitor}
    spec:
      containers:
        - name: app
          image: cloud-service-health-monitor:1.0.0
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: 8080}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "256Mi"}
